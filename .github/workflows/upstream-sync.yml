name: Sync upstream

on:
  schedule:
    # Monday 06:00 UTC = 07:00 CET (08:00 CEST during DST)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_URL: https://github.com/the-momentum/open-wearables.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Count new commits
        id: check
        run: |
          count=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "Upstream has no new commits — nothing to sync." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Found **$count** new commit(s) in \`upstream/${UPSTREAM_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare sync branch
        if: steps.check.outputs.count != '0'
        id: branch
        run: |
          date_tag=$(date -u +%Y-%m-%d)
          branch="chore/upstream-sync-${date_tag}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "date=$date_tag" >> "$GITHUB_OUTPUT"
          git checkout -B "$branch"

      - name: Merge upstream
        if: steps.check.outputs.count != '0'
        run: |
          if git merge --ff-only "upstream/${UPSTREAM_BRANCH}"; then
            echo "Fast-forwarded to upstream/${UPSTREAM_BRANCH}."
          else
            echo "FF not possible — creating a merge commit."
            if ! git merge --no-ff --no-edit "upstream/${UPSTREAM_BRANCH}" \
                 -m "chore: merge upstream/${UPSTREAM_BRANCH} (${{ steps.branch.outputs.date }})"; then
              echo "::error::Merge conflicts detected — manual sync required this week."
              git merge --abort || true
              exit 1
            fi
          fi

      - name: Build PR body and summary
        if: steps.check.outputs.count != '0'
        run: |
          range="origin/${UPSTREAM_BRANCH}..HEAD"
          all=$(git log "$range" --pretty=format:'%h %s')

          # Conventional-commit groups, in display order.
          types="feat fix perf refactor docs test build ci chore style revert"
          alt=$(echo "$types" | tr ' ' '|')

          {
            echo "## Upstream sync — ${{ steps.branch.outputs.date }}"
            echo
            echo "**${{ steps.check.outputs.count }} new commit(s)** from \`the-momentum/open-wearables@${UPSTREAM_BRANCH}\`."
            echo
            for t in $types; do
              matches=$(echo "$all" | grep -iE "^[0-9a-f]+ ${t}(\(.*\))?(!)?:" || true)
              if [ -n "$matches" ]; then
                # Capitalize first letter for the header
                header="$(echo "${t:0:1}" | tr '[:lower:]' '[:upper:]')${t:1}"
                echo "### ${header}"
                echo "$matches" | sed -E 's/^([0-9a-f]+) /- `\1` /'
                echo
              fi
            done
            other=$(echo "$all" | grep -ivE "^[0-9a-f]+ (${alt})(\(.*\))?(!)?:" || true)
            if [ -n "$other" ]; then
              echo "### Other"
              echo "$other" | sed -E 's/^([0-9a-f]+) /- `\1` /'
              echo
            fi
            echo "---"
            echo "_Auto-generated by \`.github/workflows/upstream-sync.yml\`._"
          } > pr-body.md

          cat pr-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Push branch
        if: steps.check.outputs.count != '0'
        run: git push --force-with-lease origin "${{ steps.branch.outputs.name }}"

      - name: Create or update PR
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list \
            --head "${{ steps.branch.outputs.name }}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          title="chore: sync upstream main (${{ steps.branch.outputs.date }})"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file pr-body.md
            echo "Updated PR #$existing"
          else
            gh pr create \
              --title "$title" \
              --body-file pr-body.md \
              --base "${UPSTREAM_BRANCH}" \
              --head "${{ steps.branch.outputs.name }}"
          fi
