# Open Wearables prod on Hostman (VPS axl-ow, de-1, private 10.20.0.11), since 2026-11-01.
# Upstream's own setup: the app runs migrations + data migrations on start (scripts/start/app.sh),
# Celery worker + beat run the background and periodic tasks on a local Redis. No Cloud Run,
# Cloud Tasks or Cloud Scheduler any more. Postgres is Hostman's managed cluster at 10.20.0.4
# (private network only); outgoing webhooks go to hosted Svix (EU). Secrets live in ./ow.env
# (chmod 600).
#
# Docker publishes ports past ufw, so every app port binds to 127.0.0.1; only Caddy is public.
name: ow

x-backend: &backend
  image: ${OW_BACKEND_IMAGE}
  restart: unless-stopped
  env_file: ow.env
  environment:
    REDIS_HOST: redis
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:
  app:
    <<: *backend
    command: scripts/start/app.sh
    ports: ["127.0.0.1:8000:8000"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      # app.sh applies migrations and data migrations before uvicorn starts.
      start_period: 600s
      retries: 3

  celery-worker:
    <<: *backend
    command: scripts/start/worker.sh
    # io (threads) + cpu (prefork x2) workers; Strava backfills peaked near 1 GiB on Cloud Run.
    mem_limit: 1536m
    stop_grace_period: 60s

  celery-beat:
    <<: *backend
    command: scripts/start/beat.sh
    mem_limit: 256m

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: ${OW_FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      VITE_API_URL: https://ow-api.axl.coach
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # Started at cut-over, once ow-api / ow-dashboard point here: before that every ACME
  # attempt would fail and count against Let's Encrypt limits.
  caddy:
    image: caddy:2.10
    profiles: ["edge"]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, frontend]

volumes:
  redis_data:
  caddy_data:
  caddy_config:
