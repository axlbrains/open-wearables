[project]
name = "open-wearables"
version = "0.9.11"
description = ""
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "pydantic-settings>=2.15.0",
    "email-validator>=2.2.0",
    "psycopg>=3.3.5",
    "sqlalchemy>=2.0.54",
    "fastapi>=0.139.2",
    "fastapi-cli>=0.0.32",
    "celery>=5.6.3",
    "flower>=2.1.0",
    "redis>=8.1.0",
    "sentry-sdk[fastapi]>=2.69.1",
    "python-multipart>=0.0.32",
    "python-jose[cryptography]>=3.5.0",
    "httpx[http2]>=0.28.1",
    "alembic>=1.20.0",
    "boto3>=1.43.96",
    "requests>=2.34.2",
    "bcrypt>=5.0.0",
    "isodate>=0.7.2",
    "resend>=2.46.0",
    "pyyaml>=6.0.3",
    "svix>=2.5.0",
    "numpy>=2.5.3",
    "faker>=40.39.0",
    "fitdecode>=0.11.0",
    "google-auth>=2.58.0",
]

[dependency-groups]
code-quality = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "freezegun>=1.5.0",
    "factory-boy>=3.3.0",
    "psycopg-binary>=3.3.5",
    "testcontainers[postgres,redis]>=4.14.2",
]

[tool.ruff]
line-length = 120
target-version = 'py313'
exclude = [
    "README.md",
    ".python-version",
    "LICENSE",
    "app/models/",
    # `alembic merge` writes the template's unused op/sa imports, and these revisions are
    # already applied everywhere. scripts/check_migrations.py compares the down_revision
    # line verbatim, so any reformatting — even a trailing `# fmt: skip` — reads as a
    # re-point and fails the chain check. Frozen instead. Lint NEW merge revisions with
    # `uv run ruff check .` before the first commit and they never need an entry here.
    "migrations/versions/2026_07_06_1050-b6e275a43d8b_merge_upstream_axl_heads_2026_07_06.py",
    "migrations/versions/2026_08_15_2116-20f158966eb6_merge_upstream_and_axl_heads_2026_08_15.py",
    "migrations/versions/2026_09_07_0843-8bc287ccbf32_merge_upstream_and_axl_heads_2026_09_07.py",
]

[tool.ruff.lint]
select = [
    "I",     # isort
    "F",     # pyflakes
    "FAST",  # FastApi
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "COM",   # flake8-commas
    "T10",   # flake8-debugger
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "N",     # pep8-naming
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
]
ignore = [
    "ANN002", # missing-type-args
    "ANN003", # missing-type-kwargs
    "ANN204", # missing-return-type-special-method
    "ANN401", # any-type
    "RET503", # implicit-return
    "COM812", # trailing-comma (conflicts with ruff format)
]
[tool.ruff.lint.per-file-ignores]
"app/api/routes/v*/*.py" = ["ANN201"] # missing-type-annotation
"app/schemas/providers/garmin/*.py" = ["N815"]  # mixedCase from external API
"app/schemas/providers/suunto/*.py" = ["N815"]  # mixedCase from external API

[tool.ruff.lint.isort]
known-third-party = ["celery"]

[tool.ty.src]
exclude = ["migrations/", "app/models/", "tests/", "README.md", ".python-version", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
addopts = "-v --tb=short"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"
